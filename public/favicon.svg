<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#D4FF1A"/>
      <stop offset="100%" stop-color="#A0CC00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <circle cx="20" cy="20" r="1" fill="#C1F100" opacity="0.15"/>
  <circle cx="44" cy="20" r="1" fill="#C1F100" opacity="0.1"/>
  <circle cx="68" cy="20" r="1" fill="#C1F100" opacity="0.15"/>
  <circle cx="92" cy="20" r="1" fill="#C1F100" opacity="0.1"/>
  <circle cx="108" cy="20" r="1" fill="#C1F100" opacity="0.15"/>
  <circle cx="20" cy="108" r="1" fill="#C1F100" opacity="0.15"/>
  <circle cx="44" cy="108" r="1" fill="#C1F100" opacity="0.1"/>
  <circle cx="68" cy="108" r="1" fill="#C1F100" opacity="0.15"/>
  <circle cx="92" cy="108" r="1" fill="#C1F100" opacity="0.1"/>
  <circle cx="108" cy="108" r="1" fill="#C1F100" opacity="0.15"/>

  <!-- Corner brackets (code aesthetic) -->
  <path d="M16 36 L16 16 L36 16" stroke="#C1F100" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M112 92 L112 112 L92 112" stroke="#C1F100" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Main "a" letter with glow -->
  <text x="64" y="90" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="82" font-weight="700" font-style="italic" fill="url(#lime)" filter="url(#glow)">a</text>

  <!-- Decorative slash -->
  <line x1="88" y1="28" x2="96" y2="42" stroke="#C1F100" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Accent dot -->
  <circle cx="98" cy="34" r="3" fill="#C1F100" opacity="0.7"/>

  <!-- Bottom accent line -->
  <line x1="30" y1="104" x2="98" y2="104" stroke="url(#lime)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
